name: Salon backend transfer study
on:
  push:
    branches: [main, research/salon-transfer]
    paths:
      - 'backends/salon/**'
      - 'integrations/salon/**'
      - 'tests/test_salon.py'
      - 'configs/salon-transfer.json'
      - 'docs/salon-protocol.md'
      - 'scripts/analyze_salon.py'
      - 'scripts/salon_http_smoke.py'
      - '.github/workflows/salon-study.yml'
  pull_request:
    paths:
      - 'backends/salon/**'
      - 'integrations/salon/**'
      - 'tests/test_salon.py'
      - 'configs/salon-transfer.json'
      - '.github/workflows/salon-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backends/salon/requirements.lock
      - name: HTTP, SQL, rollback and concurrency contracts
        run: python -m unittest discover -s tests -p 'test_salon.py' -v
      - name: Actual TCP business workflow
        run: python -m scripts.salon_http_smoke
      - name: Execute the frozen 640-campaign matrix
        run: python -m integrations.salon.run --out /tmp/salon-study
      - name: Verify offline evidence
        run: |
          python - <<'PY'
          from scripts.analyze_salon import analyze
          analyze('/tmp/salon-study')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: salon-${{ github.sha }}
          path: /tmp/salon-study
      - name: Record research observations on the research branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/salon-transfer'
        run: |
          mkdir -p results/salon-v05
          cp /tmp/salon-study/* results/salon-v05/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/salon-v05
          git diff --cached --quiet || git commit -m "Record frozen second-domain salon matrix [skip ci]"
          git push origin HEAD:research/salon-transfer
