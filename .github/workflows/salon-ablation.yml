name: Authorization component ablation checks
on:
  push:
    branches: [main, research/paper-v06]
    paths:
      - 'integrations/salon_ablation/**'
      - 'tests/test_salon_ablation.py'
      - 'configs/salon-ablation.json'
      - 'docs/salon-ablation-protocol.md'
      - 'scripts/*salon_ablation.py'
      - 'results/salon-v06/**'
      - '.github/workflows/salon-ablation.yml'
  pull_request:
    paths:
      - 'integrations/salon_ablation/**'
      - 'tests/test_salon_ablation.py'
      - 'configs/salon-ablation.json'
      - 'docs/salon-ablation-protocol.md'
      - 'scripts/*salon_ablation.py'
      - 'results/salon-v06/**'
      - '.github/workflows/salon-ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backends/salon/requirements.lock
      - name: Complete test suite including exact treatment comparisons
        run: python -m unittest discover -s tests -v
      - name: Preserve the v0.5 source and observations
        run: python -m scripts.analyze_salon
      - name: Verify archived v0.6 matrix and all planned effects
        if: hashFiles('results/salon-v06/manifest.json') != ''
        run: python -m scripts.analyze_salon_ablation
      - name: Replay archived v0.6 witnesses against HTTP/SQL
        if: hashFiles('results/salon-v06/manifest.json') != ''
        run: python -m scripts.replay_salon_ablation
      - name: Full frozen matrix on explicit dispatch
        if: github.event_name == 'workflow_dispatch'
        run: python -m integrations.salon_ablation.run --out /tmp/salon-ablation
      - name: Verify fresh dispatched matrix
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          from scripts.analyze_salon_ablation import analyze
          analyze('/tmp/salon-ablation')
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: salon-ablation-${{ github.sha }}
          path: /tmp/salon-ablation
