name: Public real-backend case validation
on:
  push:
    branches: [research/aoristo-fixes]
    paths:
      - 'case_studies/aoristo/**'
      - 'integrations/aoristo_case/**'
      - 'scripts/materialize_aoristo.py'
      - 'tests/test_aoristo_case.py'
      - '.github/workflows/aoristo-case.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        variant: [original, fixed]
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: sglab_case
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab -d sglab_case"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/aoristo/requirements.lock
      - run: pip install -r integrations/aoristo/requirements.lock
      - run: python -m unittest discover -s tests -v
      - name: Materialize selected real backend
        run: python -m scripts.materialize_aoristo --variant '${{ matrix.variant }}' --out /tmp/aoristo-case
      - name: Check real HTTP and PostgreSQL effects
        run: >-
          python -m integrations.aoristo_case.run --variant '${{ matrix.variant }}'
          --source /tmp/aoristo-case
          --database-url postgresql://lab:lab@127.0.0.1:5432/sglab_case
          --out results/aoristo-v04-${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aoristo-v04-${{ matrix.variant }}
          path: results/aoristo-v04-${{ matrix.variant }}
          if-no-files-found: ignore
  record:
    needs: case
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/research/aoristo-fixes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aoristo-v04-*
          path: results
      - name: Record verified fixture observations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/aoristo-v04-original results/aoristo-v04-fixed
          git commit -m "Record public real-backend original and fixed validation"
          git push origin HEAD:research/aoristo-fixes
