name: Research artifact checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m fuzzlab demo
      - run: python -m fuzzlab run --config configs/smoke.json --out results/ci
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-python-${{ matrix.python }}
          path: results/ci
  http-contracts:
    # The matrix above checks the dependency-free core; this job runs the
    # HTTP/SQL, rollback and concurrency tests that otherwise skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backends/salon/requirements.lock
      - name: Full suite with no dependency skips
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
          if grep -q "skipped" unittest.log; then echo "unexpected skipped tests"; exit 1; fi
