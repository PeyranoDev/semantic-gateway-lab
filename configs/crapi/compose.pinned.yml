# Compose override for crAPI at revision 700f03d12a392d9e408260b4beae72ed02a4a1a4.
# No 1.1.5 images are published. The `main` images were built 2025-09-22, 5-209 minutes
# after that commit, which is still upstream main HEAD. The workshop application
# files in the image are byte-identical to the pinned source (diff -r: 0 differences).
# Use with the upstream file:
#   docker compose -p crapi-sglab -f <crAPI>/deploy/docker/docker-compose.yml \
#     -f configs/crapi/compose.pinned.yml up -d --wait crapi-workshop
# The study calls identity, community and workshop directly on 127.0.0.1. crapi-web
# (nginx) is not started: its configuration requires the chatbot upstream, and it only
# routes requests. The chatbot and chromadb stacks are not started.
services:
  crapi-identity:
    image: crapi/crapi-identity@sha256:5d1db5b3ba8e02bc68711ec6fc4e35ed7cd8b87e63785ece9e7ff5b5e36c5260
    ports:
      - "127.0.0.1:8080:8080"
  crapi-community:
    image: crapi/crapi-community@sha256:8ba0c7eda86ae065a673f1fa554d0109a24f25c5a8d65097ae024e5ee715c54e
    ports:
      - "127.0.0.1:8087:8087"
  crapi-workshop:
